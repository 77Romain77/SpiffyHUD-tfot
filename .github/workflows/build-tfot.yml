name: Build TFOT optimized JAR

on:
  push:
    branches:
      - "1.20.1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TFOT optimizations
        run: |
          base64 --decode tfot-optimizations.patch.gz.b64 | gzip --decompress > tfot-optimizations.patch
          patch --batch --forward --strip=1 < tfot-optimizations.patch

      - name: Build Forge JAR
        run: |
          chmod +x gradlew
          ./gradlew :forge:build --stacktrace

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpiffyHUD-TFOT-Forge-1.20.1
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
