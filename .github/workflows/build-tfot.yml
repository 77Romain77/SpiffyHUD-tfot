name: Build TFOT optimized JAR

on:
  push:
    branches:
      - "1.20.1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Apply TFOT optimizations
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/77Romain77/SpiffyHUD-tfot/fc7b8d86f45b1f65bb4f721be26a9408c23a2b6f/tfot-optimizations.patch.gz.b64 \
            --output tfot-optimizations.patch.gz.b64
          base64 --decode tfot-optimizations.patch.gz.b64 | gzip --decompress > tfot-optimizations.patch
          patch --batch --forward --strip=1 < tfot-optimizations.patch
          patch --batch --forward --strip=1 < tfot-compile-fixes.patch
          cat tfot-debug-overlay.patch.gz.b64.part1 tfot-debug-overlay.patch.gz.b64.part2 tfot-debug-overlay.patch.gz.b64.part3 tfot-debug-overlay.patch.gz.b64.part4 | base64 --decode | gzip --decompress > tfot-debug-overlay.patch
          patch --batch --forward --strip=1 < tfot-debug-overlay.patch
          patch --batch --forward --strip=1 < tfot-debug-compile-fixes.patch
          patch --batch --forward --strip=1 < tfot-debug-v2.patch

      - name: Build Forge JAR
        run: |
          chmod +x gradlew
          if ! ./gradlew :forge:build --console=plain > gradle-build.log 2>&1; then
            grep -n -B 4 -A 12 -E 'error:|cannot find symbol|incompatible types|Compilation failed' gradle-build.log || tail -n 200 gradle-build.log
            exit 1
          fi
          cat gradle-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpiffyHUD-TFOT-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpiffyHUD-TFOT-Forge-1.20.1
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
