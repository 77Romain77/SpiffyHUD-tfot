name: Build performance test

on:
  push:
    branches:
      - agent/spiffy-hud-performance-profiler
  pull_request:
    branches:
      - 1.20.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload test jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spiffyhud-performance-test
          if-no-files-found: error
          path: |
            forge/build/libs/*.jar
            fabric/build/libs/*.jar
            !**/*-sources.jar
